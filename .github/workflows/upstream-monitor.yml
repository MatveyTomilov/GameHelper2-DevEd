name: Upstream monitor

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Monitor live sources or run a controlled API test
        type: choice
        options: [monitor, fixture, test-api]
        default: monitor

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check configured sources
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_MODE: ${{ inputs.mode || 'monitor' }}
        run: |
          if [ "$MONITOR_MODE" != monitor ]; then
            python3 -m unittest discover -s dev/upstream -q
          fi
          if [ "$MONITOR_MODE" != fixture ]; then
            timeout 40s python3 dev/upstream/monitor.py "$MONITOR_MODE"
          fi
      - name: Keep check timestamps
        if: always() && hashFiles('upstream-checks.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upstream-checks
          path: upstream-checks.json
          retention-days: 7
          compression-level: 1
